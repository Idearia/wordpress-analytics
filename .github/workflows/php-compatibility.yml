name: PHP compatibility

on:
  push:
    branches: [php]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install locked production dependencies
        run: composer install --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Verify real production platform requirements
        run: composer check-platform-reqs --no-dev
      - name: Lint plugin and test sources
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test YAML and settings with E_ALL
        run: php tests/php-compatibility.php
